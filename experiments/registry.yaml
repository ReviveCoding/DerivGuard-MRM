schema_version: '1.0'
registry_status: ARTIFACT_DERIVED_RECONCILED
scientific_integrity_note: Statuses are derived from hashed, semantically inspected artifacts. COMPLETED
  requires non-placeholder measured rows and satisfied predicates; PARTIAL and UNAVAILABLE preserve attempted
  limitations. Frozen confirmatory registries are not mutated by reconciliation.
status_vocabulary:
- PLANNED
- READY
- RUNNING
- COMPLETED
- FAILED
- UNAVAILABLE
- SUPERSEDED
- PARTIAL
profiles:
  smoke: bounded deterministic and reduced-size checks before expensive execution
  research: full feasible pre-registered execution using qualified GPU workloads
  audit: artifact reconciliation and acceptance-gate verification
split_policy:
  real_data:
    unit: complete_market_date_surface
    initial_target:
      DEV: 0.6
      VALIDATION: 0.2
      LOCKED_TEST: 0.2
