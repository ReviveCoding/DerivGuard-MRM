    independent_partitions:
    - DEV
    - VALIDATION
    - LOCKED_TEST
    - OOD
    seed_registry_status: FROZEN_BEFORE_LOCKED_EXECUTION
    executed_case_counts:
      DEV: 34
      LOCKED_TEST: 34
      OOD_LOCKED_TEST: 17
      VALIDATION: 17
    confirmatory_design: v6_release_aligned_prequalified_calibration
    evidence:
