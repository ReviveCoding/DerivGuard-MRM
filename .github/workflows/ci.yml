name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and CPU development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch==2.14.0+cpu" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev,oracle]"

      - name: Check installed dependencies
        run: python -m pip check

      - name: Check formatting
        run: python -m ruff format --check src tests scripts

      - name: Lint
        run: python -m ruff check src tests scripts

      - name: Type check
        run: python -m mypy src

      - name: Run CPU-safe tests
        run: python -m pytest -q -m "not gpu and not numerical" --basetemp="${RUNNER_TEMP}/pytest-cpu"

      - name: Run numerical tests
        run: python -m pytest -q -m numerical --basetemp="${RUNNER_TEMP}/pytest-numerical"

      - name: Verify published evidence integrity
        run: python scripts/verify_publication_integrity.py
