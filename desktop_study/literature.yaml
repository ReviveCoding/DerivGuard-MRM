    assumptions:
      - "Underlying dynamics are a one-factor diffusion with deterministic local volatility."
      - "A smooth, arbitrage-consistent option surface and consistent rates/dividends are available."
    strengths:
      - "Fits the contemporaneous vanilla surface by construction in the ideal continuum limit."
      - "Provides a distinct state-dependent volatility challenger."
