  - id: METH-HESTON-1993
    title: "A Closed-Form Solution for Options with Stochastic Volatility with Applications to Bond and Currency Options"
    authors: ["Steven L. Heston"]
    year: 1993
    publication: "The Review of Financial Studies 6(2), 327-343"
    url: "https://doi.org/10.1093/rfs/6.2.327"
    doi: "10.1093/rfs/6.2.327"
    source_type: "peer_reviewed_article"
    access_status: "publisher metadata verified; public copies exist; publisher full text may be access-controlled"
    retrieved_at: "2026-09-27"
    method: "Affine stochastic-variance model with a semi-analytic characteristic-function solution for European options."
    assumptions:
      - "Spot follows a diffusion with square-root stochastic variance."
      - "Variance mean reverts and spot/variance Brownian motions have constant correlation."
      - "Risk-neutral parameters and term structures are specified consistently."
    strengths:
      - "Captures smile/skew mechanisms absent from constant-volatility Black-Scholes."
      - "Semi-analytic vanilla pricing is suitable for calibration and batching."
    weaknesses:
      - "Five parameters can be weakly identified."
      - "Diffusion-only dynamics omit price jumps."
      - "Naive characteristic-function implementations can suffer branch and integration problems."
    implementation_implications:
      - "Primary developer model M10."
      - "Use stable characteristic function, explicit quadrature controls, and independent validators."
      - "Test both Feller-satisfied and Feller-violating regions."
    related_experiment_ids: ["N02", "N03", "N09", "N10", "C01-C09", "M03", "S01"]

